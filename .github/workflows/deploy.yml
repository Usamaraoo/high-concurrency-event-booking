deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to the folder you manually cloned
            cd ~/event-booking || { echo "Folder not found! Did you run git clone?"; exit 1; }

            # 2. Pull the latest code changes from GitHub
            git pull origin main

            # 3. Pull the NEW Docker image from Docker Hub
            # Using hyphenated version to fix your 'unknown command' error
            docker-compose pull

            # 4. Restart the containers using your local .env.docker file
            docker-compose --env-file .env.docker up -d